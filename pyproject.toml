[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "riskshare-research"
version = "0.1.0"
description = "Risk-adaptive threshold secret sharing research prototype"
requires-python = ">=3.11"
dependencies = [
  "alembic>=1.14,<2",
  "cryptography>=42,<47",
  "fastapi>=0.115,<1",
  "pydantic>=2.9,<3",
  "psycopg[binary]>=3.2,<4",
  "redis>=5,<7",
  "sqlalchemy>=2,<3",
  "uvicorn[standard]>=0.30,<1",
]

[project.optional-dependencies]
dev = [
  "hypothesis>=6,<7",
  "httpx>=0.27,<1",
  "mypy>=1.13,<2",
  "pytest>=8,<10",
  "ruff>=0.9,<1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008"] # FastAPI dependencies are declared with Depends in endpoint signatures.

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["core"]

[tool.setuptools.packages.find]
include = ["core*", "services*"]
